spring:
  grpc:
    server:
      port: 0
  kafka:
    listener:
      auto-startup: false
  liquibase:
    enabled: true
    change-log: classpath:migrations/master.xml

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  task:
    scheduling:
      enabled: false
  data:
    redis:
          repositories:
            enabled: false

management:
  defaults:
    metrics:
      export:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
  endpoints:
    enabled-by-default: false

app:
  database:
    access-type: sql

  grpc:
    server-port: 9093
    bot-host: localhost
    bot-port: 9092

  kafka:
    enabled: false

  bot:
    transport: rest
    rest:
      base-url: http://localhost:8080

  stackoverflow:
    key: test-key
    access-token: test-access-token

  github:
    token: test-token

  scheduler:
    enabled: false
    interval: 99999999


springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
