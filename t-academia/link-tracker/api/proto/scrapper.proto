syntax = "proto3";

package proto;

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";

service ScrapperService {
    rpc RegisterChat(RegisterChatRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            post: "/tg-chat/{id}"
            body: "*"
        };
    }

    rpc DeleteChat(DeleteChatRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            delete: "/tg-chat/{id}"
        };
    }

    rpc GetAllTrackedLinks(GetAllTrackedLinksRequest) returns (ListLinksResponse) {
        option (google.api.http) = {
            get: "/links"
        };
    }

    rpc AddLink(AddLinkRequest) returns (LinkResponse) {
        option (google.api.http) = {
            post: "/links"
            body: "*"
        };
    }

    rpc RemoveLink(RemoveLinkRequest) returns (LinkResponse) {
        option (google.api.http) = {
            delete: "/links"
            body: "*"
        };
    }
}

message RegisterChatRequest {
    int64 id = 1;
}

message DeleteChatRequest {
    int64 id = 1;
}

message GetAllTrackedLinksRequest {
    int64 tg_chat_id = 1;
}

message AddLinkRequest {
    int64 tg_chat_id = 1;
    string link = 2;
    repeated string tags = 3;
    repeated string filters = 4;
}

message RemoveLinkRequest {
    int64 tg_chat_id = 1;
    string link = 2;
}

message LinkResponse {
    int64 id = 1;
    string url = 2;
    repeated string tags = 3;
    repeated string filters = 4;
}

message ListLinksResponse {
    repeated LinkResponse links = 1;
    int32 size = 2;
}

